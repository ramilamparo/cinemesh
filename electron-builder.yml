appId: app.cinemesh
productName: Cinemesh
# Linux window association: Electron uses package.json desktopName as the Wayland app_id / X11 WM_CLASS, and
# linux.syncDesktopName names the installed .desktop file after it (StartupWMClass follows), so the running window
# matches its launcher entry. Injected here because package.json has no desktopName; it must equal
# `${LINUX_APP_ID}.desktop` in src/main/linux-desktop.ts (checked by linux-desktop.test.ts).
extraMetadata:
  desktopName: app.cinemesh.desktop
  # The deb/rpm/pacman URL field (electron-builder refuses to build them without a homepage). PLACEHOLDER until the
  # project is published: keep it in step with DOWNLOAD_URL in src/core/net/invite.ts and the issue tracker link in
  # resources/licenses/mpv/SOURCE-OFFER.md.
  homepage: https://github.com/watch-together-p2p/watch-together-p2p
copyright: Copyright © 2026 Cinemesh contributors
# Icons come from build/ by name: icon.icns (mac), icon.ico (win), icons/<n>x<n>.png (linux). `npm run icons`.
directories:
  output: release/${version}
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/node_modules/**/{test,tests,__tests__,example,examples,docs,.github}/**'
  - '!**/node_modules/**/*.{md,map,d.ts,ts}'
  - '!**/node_modules/**/prebuilds/{android,ios}-*/**'
  - '!**/node_modules/**/*.bare'
  # Only this OS's N-API prebuilds ship (the others are ~8 MB per package, and macOS signing would sign them too).
  # ${platform} is the OS electron-builder runs on (darwin, win32, linux), so build each package on its own OS, as CI
  # does: scripts/after-pack.mjs fails a build whose prebuilds are for another OS. Electron is a glibc build on Linux,
  # so musl prebuilds never load either. (Platform-level `files` cannot do this: they replace this list.)
  - '!**/node_modules/**/prebuilds/!(${platform}-*)/**'
  - '!**/node_modules/**/prebuilds/*-musl/**'
  - '!**/node_modules/**/*.musl.node'

# Every native dependency is an N-API prebuild (sodium-native, udx-native, fs-native-extensions, and ws's optional
# bufferutil / utf-8-validate), so nothing needs rebuilding against Electron's ABI; skipping @electron/rebuild also
# keeps compilers out of the build.
npmRebuild: false

# N-API prebuilds (udx-native, sodium-native, ...) must live outside the asar to be dlopen()ed.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/udx-native/**'
  - '**/node_modules/sodium-native/**'

# Every platform: the OSC script and the licence notices (mpv's GPL text + source offer, npm dependencies).
# The bundled mpv is added per platform below (Linux uses the system or Flatpak mpv).
extraResources:
  - from: resources/mpv-scripts
    to: mpv-scripts
  - from: resources/licenses
    to: licenses

# Fails the build when the bundled mpv (Windows/macOS) or the licence notices are missing, or when the packaged
# addon prebuilds are not this OS's (scripts/after-pack.mjs).
afterPack: ./scripts/after-pack.mjs

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

protocols:
  - name: Cinemesh invite
    schemes:
      - cinemesh

mac:
  category: public.app-category.video
  # "-" = ad-hoc signature. null would skip signing and leave a broken seal ("app is damaged"). electron-builder's
  # signing (@electron/osx-sign) also signs everything inside Contents/, so the nested mpv.app below is ad-hoc signed
  # with the same identity, deepest file first, before the app itself; it then runs codesign --verify --deep --strict.
  identity: '-'
  hardenedRuntime: false
  target:
    - dmg
    - zip
  # Separate arm64 and x64 builds (one per CI runner); name both, since the default leaves the arch out for x64.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  extendInfo:
    NSLocalNetworkUsageDescription: Cinemesh connects directly to your friends' computers to share the video.
  # scripts/fetch-mpv.mjs --platform mac-arm64,mac-x64 → <App>.app/Contents/Resources/mpv/mpv.app
  extraResources:
    - from: vendor/mpv/${os}-${arch}
      to: mpv

win:
  target:
    - nsis
    - zip
  # scripts/fetch-mpv.mjs --platform win-x64 → resources/mpv/mpv.exe
  extraResources:
    - from: vendor/mpv/${os}-${arch}
      to: mpv

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Writes and removes HKCU\Software\Classes\cinemesh (the invite-link scheme).
  include: build/installer.nsh

linux:
  category: AudioVideo
  # deb Maintainer / rpm Packager and Vendor / pacman packager (electron-builder requires one; package.json has no
  # author). Add a contact address here once the project has one.
  maintainer: Cinemesh contributors
  syncDesktopName: true
  synopsis: Watch videos in sync with friends, shared peer-to-peer
  # `protocols` above adds MimeType=x-scheme-handler/cinemesh; to the .desktop entry, whose Exec ends in %U.
  target:
    - AppImage
    - deb
    - rpm
    - pacman

# mpv >= 0.39 is required at runtime; Ubuntu 24.04 and Debian 12 ship older ones, so deb/rpm only recommend it and
# the app offers Flatpak io.mpv.Mpv (MpvSetup). deb and rpm keep electron-builder's default depends.
deb:
  # Replaces electron-builder's default recommends (libappindicator3-1): Electron 44's tray talks StatusNotifierItem
  # over D-Bus and never loads libappindicator.
  recommends:
    - mpv
rpm:
  # electron-builder has no rpm `recommends`; fpm's --rpm-tag writes the weak dependency into the spec (RPM >= 4.12).
  fpm:
    - --rpm-tag
    - 'Recommends: mpv'
pacman:
  # Arch ships mpv 0.41, so it is a hard dependency there. electron-builder's default list names packages Arch no
  # longer has (libappindicator-gtk3, http-parser), which makes `pacman -U` refuse the package, and system libraries
  # the bundled Electron never loads. This is what Electron 44's binary links (readelf -d), plus libnotify and xdg-utils.
  depends:
    - gtk3
    - nss
    - alsa-lib
    - at-spi2-core
    - libcups
    - libxkbcommon
    - mesa
    - libxcomposite
    - libxdamage
    - libxrandr
    - libnotify
    - xdg-utils
    - mpv
