# Release (docs/RELEASING.md "Cutting a release"). Start it from Actions → Release → Run workflow on main, choosing
# patch, minor or major (or an exact version). It then:
#   1. prepare: bumps package.json and package-lock.json (`npm version`), moves CHANGELOG.md's Unreleased notes under
#      the new version (scripts/changelog.mjs), commits "Release <version>" to main and tags v<version>;
#   2. ci: runs the whole CI workflow on that tag (ci.yml, workflow_call), which builds, checks and smoke-launches
#      every package, named with the version;
#   3. release: publishes the GitHub release "Cinemesh <version>" (marked latest, or pre-release for a version like
#      1.2.0-beta.1) with the packages, SHA256SUMS and the mpv source tarball that
#      resources/licenses/mpv/SOURCE-OFFER.md promises; its notes are the version's CHANGELOG section and a download
#      table. With the MINISIGN_SECRET_KEY secret set (an unencrypted key from `minisign -G -W`), SHA256SUMS is also
#      signed (SHA256SUMS.minisig).
# Dry run: builds every package with the next version and prints the notes, but pushes nothing and publishes nothing.
# A v* tag pushed by hand (after `npm version` locally) releases too: steps 2 and 3, once the tag is checked against
# package.json and CHANGELOG.md. The builds are unsigned (ad-hoc on macOS): docs/install.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version (e.g. 0.2.0 or 0.2.0-beta.1); overrides the choice above
        type: string
        default: ''
      dry-run:
        description: Dry run (build and show the notes; push and publish nothing)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time; a second one waits instead of racing for the next version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: version and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
      ref: ${{ steps.out.outputs.ref }}
      dry-run: ${{ steps.out.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # all history and tags: npm version refuses a tag that already exists
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Bump the version, the changelog, commit and tag (Run workflow)
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.version || inputs.bump }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$DRY_RUN" != true ]; then
            echo "::error::release from main (this run is on $GITHUB_REF); a dry run works on any branch"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Runs the `version` script (scripts/changelog.mjs release), which fails on an empty Unreleased section.
          # An exact version must not go below package.json's (x.y.z compared numerically; pre-release parts aside).
          node -e '
            const [cur, next] = [require("./package.json").version, process.argv[1]].map((v) => v.split(/[-+]/)[0].split(".").map(Number))
            if (next.length === 3 && !next.some(Number.isNaN) && next.join(".") !== cur.join(".")) {
              const i = next.findIndex((n, k) => n !== cur[k])
              if (next[i] < cur[i]) { console.error("::error::" + process.argv[1] + " is lower than " + cur.join(".")); process.exit(1) }
            }
          ' "$BUMP"
          # --allow-same-version: the first release can be the version package.json already has (0.1.0).
          npm version "$BUMP" --allow-same-version -m 'Release %s'
          if [ "$DRY_RUN" != true ]; then
            # Both refs or neither: if main moved since this run started, the push is rejected (not a fast-forward)
            # and nothing lands, rather than a Release commit on main without its tag.
            git push --atomic origin HEAD:refs/heads/main "refs/tags/v$(node -p 'require("./package.json").version')"
          fi
      - name: Check the tag against package.json and CHANGELOG.md (pushed tag)
        if: github.event_name == 'push'
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Outputs and release notes
        id: out
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          version=$(node -p 'require("./package.json").version')
          {
            echo "version=$version"
            echo "tag=v$version"
            # A dry run pushed nothing: CI builds this run's commit, with the new version.
            if [ "$DRY_RUN" = true ]; then echo "ref=$GITHUB_SHA"; else echo "ref=v$version"; fi
            echo "dry-run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          mkdir -p notes
          node scripts/changelog.mjs notes "$version" > notes/changes.md
          echo "Cinemesh $version" && cat notes/changes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes/changes.md
          if-no-files-found: error
          retention-days: 7

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read

  release:
    name: publish
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DRY_RUN: ${{ needs.prepare.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Flatten the artifacts (upload-artifact keeps release/<version>/ below the wildcard)
        run: |
          find dist -mindepth 2 -type f -exec mv -n -t dist -- {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist
      - name: mpv source tarball (corresponding source of the bundled mpv, SHA-256 pinned)
        run: |
          node scripts/fetch-mpv.mjs --source
          cp vendor/mpv/source/mpv-*.tar.gz dist/
      - name: Asset names without spaces, and SHA256SUMS
        working-directory: dist
        run: |
          for f in *' '*; do
            if [ -e "$f" ]; then mv -- "$f" "${f// /-}"; fi
          done
          # Every package carries the release's version in its name (the mpv tarball carries mpv's).
          for f in *; do
            case "$f" in
              mpv-*.tar.gz | *"$VERSION"*) ;;
              *) echo "::error::$f does not name version $VERSION"; exit 1 ;;
            esac
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Is a minisign key configured?
        id: minisign
        env:
          HAS_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: echo "sign=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - name: Sign SHA256SUMS (minisign)
        if: steps.minisign.outputs.sign == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m dist/SHA256SUMS -t "Cinemesh $TAG" < /dev/null
          rm -f "$key"
      - name: Release notes
        env:
          INSTALL_DOC: ${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.prepare.outputs.ref }}/docs/install.md
        run: |
          v="$VERSION"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $(cat "$RUNNER_TEMP/changes.md")

          ## Downloads

          These builds are not code-signed. [Installing Cinemesh]($INSTALL_DOC) shows how to open them on
          macOS (Open Anyway) and Windows (SmartScreen: More info, then Run anyway).

          | System | Download |
          | --- | --- |
          | Windows 10/11 (x64) | \`Cinemesh-Setup-$v.exe\` (installer) or \`Cinemesh-$v-win.zip\` |
          | Mac with Apple silicon | \`Cinemesh-$v-mac-arm64.dmg\` (or \`.zip\`) |
          | Mac with an Intel processor | \`Cinemesh-$v-mac-x64.dmg\` (or \`.zip\`) |
          | Linux (x64) | \`Cinemesh-$v.AppImage\`, \`cinemesh_${v}_amd64.deb\`, \`cinemesh-$v.x86_64.rpm\`, \`cinemesh-$v.pacman\` |

          On Linux, install mpv 0.39 or newer, or the Flatpak \`io.mpv.Mpv\`. The Windows and macOS packages include
          mpv 0.41.0, which is GPL software: its source code is attached as \`mpv-0.41.0.tar.gz\`, and the app's
          \`licenses/mpv/SOURCE-OFFER.md\` says which builds are included. The app needs macOS 13 or later; the mpv it
          includes needs macOS 14 on Apple silicon and macOS 15 on Intel (older Macs can use their own mpv).

          Check a download with \`sha256sum --check --ignore-missing SHA256SUMS\` (and, when \`SHA256SUMS.minisig\` is
          attached, \`minisign -Vm SHA256SUMS -P <public key>\` first).
          EOF
          cat "$RUNNER_TEMP/notes.md"
          { echo "## Cinemesh $VERSION"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a pre-release part (1.2.0-beta.1) is published as a pre-release, so the download link
          # (releases/latest) keeps pointing at the last stable one.
          case "$VERSION" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "$TAG" dist/* --verify-tag "$kind" \
            --title "Cinemesh $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Dry run
        if: env.DRY_RUN == 'true'
        working-directory: dist
        run: |
          echo "Dry run: would publish $TAG with:" && ls -la
          { echo; echo "**Dry run:** nothing was pushed or published. Assets:"; echo; printf -- '- %s\n' *; } >> "$GITHUB_STEP_SUMMARY"
